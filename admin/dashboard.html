<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Ofertas - Pérola</title>

<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>Painel Ofertas</h2>
        </div>

        <nav>

            <button class="menu-btn active">
                Dashboard
            </button>

            <button class="menu-btn">
                Ofertas
            </button>

            <button class="menu-btn">
                Banner
            </button>

            <button class="menu-btn">
                Configurações
            </button>

        </nav>

    </aside>

    <main class="content">

        <header class="topbar">

            <h1>
                Dashboard
            </h1>

            <button id="novaOferta">
                + Nova Oferta
            </button>

        </header>

        <section class="cards">

    <div class="card total">
        <span>Total de Ofertas</span>
        <strong id="totalOfertas">0</strong>
    </div>

    <div class="card ativas">
        <span>Ativas</span>
        <strong id="ativas">0</strong>
    </div>

    <div class="card futuras">
        <span>Futuras</span>
        <strong id="futuras">0</strong>
    </div>

    <div class="card encerradas">
        <span>Encerradas</span>
        <strong id="encerradas">0</strong>
    </div>

</section>

        <section class="tabela-section">

            <div class="section-header">

                <h2>
                    Ofertas Cadastradas
                </h2>

            </div>

            <table>

                <thead>

                    <tr>
                        <th>Título</th>
                        <th>Status</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="listaOfertas">

                </tbody>

            </table>

        </section>

    </main>

</div>

<div class="modal" id="modalOferta">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="tituloModalOferta">Nova Oferta</h2>

            <button id="fecharModal">
                ×
            </button>

        </div>

        <form id="formOferta">

            <label>
                Título da oferta
            </label>

            <input
                type="text"
                id="tituloOferta"
                placeholder="Ex: Operação Fecha Mês"
                required>

            <label>
                Slug / Link da oferta
            </label>

            <input
                type="text"
                id="slugOferta"
                placeholder="operacao-fecha-mes"
                readonly>

<label>
    Tipo
</label>

<select id="tipoOferta">
    <option value="oferta">Oferta</option>
    <option value="banner">Banner principal</option>
</select>
            
            <div class="grid-form">

                <div>
                    <label>
                        Data e hora de início
                    </label>

                    <input
                        type="datetime-local"
                        id="dataInicio"
                        required>
                </div>

                <div>
                    <label>
                        Data e hora de fim
                    </label>

                    <input
                        type="datetime-local"
                        id="dataFim"
                        required>
                </div>

            </div>

            <div class="grid-form">

                <div>
                    <label>
                        Prioridade
                    </label>

                    <input
                        type="number"
                        id="prioridadeOferta"
                        value="999">
                </div>

                <div>
                    <label>
                        Cor da categoria
                    </label>

                    <input
                        type="color"
                        id="corOferta"
                        value="#c40000">
                </div>

            </div>

            <div class="checks">

                <label>
                    <input
                        type="checkbox"
                        id="ativoOferta"
                        checked>
                    Oferta ativa
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="ocultarOferta">
                    Ocultar oferta
                </label>

            </div>

<label>
    Imagens da oferta
</label>

<div class="upload-area" id="uploadArea">

    <input
        type="file"
        id="imagensOferta"
        accept="image/*"
        multiple>

    <p>
        Clique ou arraste as imagens aqui
    </p>

    <small>
        Você pode selecionar várias páginas da oferta de uma vez.
    </small>

</div>

<div
    class="preview-imagens"
    id="previewImagens">
</div>
            
            <button type="submit" class="btn-salvar">
                Salvar oferta
            </button>

        </form>

    </div>

</div>
    
<script src="dashboard.js"></script>

</body>
</html>
