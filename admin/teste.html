<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste Supabase</title>

<style>
body{
  font-family: Arial, sans-serif;
  padding:30px;
}

pre{
  background:#f4f4f4;
  padding:15px;
  border-radius:10px;
  overflow:auto;
}
</style>

</head>
<body>

<h1>Teste de conexão</h1>

<div id="status">
Conectando...
</div>

<pre id="resultado"></pre>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://givlthpzaqnjsetsdjmn.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_vV7JQMjvV1V6o9je46IN8A_sPWOjIHj";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function testar() {

  const status =
    document.getElementById("status");

  const resultado =
    document.getElementById("resultado");

  try {

    const { data, error } =
      await supabase
        .from("ofertas_configuracoes")
        .select("*");

    if (error) {
      throw error;
    }

    status.innerHTML =
      "✅ Conectado ao Supabase";

    resultado.textContent =
      JSON.stringify(data, null, 2);

  } catch (erro) {

    status.innerHTML =
      "❌ Erro de conexão";

    resultado.textContent =
      JSON.stringify(erro, null, 2);

    console.error(erro);
  }
}

testar();

</script>

</body>
</html>
